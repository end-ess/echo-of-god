(function(){
 var LANG='ja',P='../',G=window.GODS||[],FAC=[["divine", "神域"], ["north", "北境"], ["titan", "ティターン"], ["central", "中原"], ["abyss", "深淵"]],ST=["HP", "攻撃", "射程", "移動", "コスト"];
 var FK={"神域": "divine", "北境": "north", "提坦": "titan", "中原": "central", "深渊": "abyss"};
 var tab='all',role='',pick=G.length?G[0].s:'';
 var qp=new URLSearchParams(location.search).get('f');if(qp&&FAC.some(function(f){return f[0]===qp;}))tab=qp;
 var h=decodeURIComponent(location.hash.slice(1));if(G.some(function(g){return g.s===h;}))pick=h;
 var tabs=document.getElementById('tabs'),list=document.getElementById('list'),q=document.getElementById('q'),roles=document.getElementById('roles');
 function L(g){return g[LANG];}
 [['all','すべて']].concat(FAC).forEach(function(f){var b=document.createElement('button');b.type='button';b.className='tab';b.setAttribute('role','tab');b.textContent=f[1];b.dataset.k=f[0];b.onclick=function(){tab=f[0];render();};tabs.appendChild(b);});
 var ORD=['终端','输出','承伤','推进','防守','辅助','铺场','控制','支援','后排','前排'],MAP={};G.forEach(function(g){g.zh.r.forEach(function(r,i){MAP[r]=L(g).r[i]||r;});});
 var RS=ORD.filter(function(r){return MAP[r];}).map(function(r){return MAP[r];});
 [''].concat(RS).forEach(function(r){var b=document.createElement('button');b.type='button';b.textContent=r||'すべての役割';b.onclick=function(){role=r;render();};b.dataset.r=r;roles.appendChild(b);});
 function facName(g){return g.f.map(function(f){for(var i=0;i<FAC.length;i++)if(FAC[i][0]===FK[f])return FAC[i][1];return f;}).join(' · ');}
 function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;}
 function detail(){var g=G.filter(function(x){return x.s===pick;})[0];if(!g)return;var d=L(g);
  var im=document.getElementById('dimg');im.src=P+'img/gods/'+g.s+'.webp';im.alt=d.n;
  document.getElementById('dname').textContent=d.n;document.getElementById('den').textContent=LANG==='en'?'':g.en.n.toUpperCase();
  var tg=document.getElementById('dtags');tg.innerHTML='';tg.appendChild(el('span','tag',facName(g)));d.r.forEach(function(r){var s=el('span','tag',r);s.style.borderColor='var(--line2)';s.style.color='var(--muted)';tg.appendChild(s);});
  var st=document.getElementById('dstats');st.innerHTML='';for(var i=0;i<5;i++){var c=el('div');var v=g.st[i];c.appendChild(el('b',null,v>=1e8?'∞':String(v)));c.appendChild(el('span',null,ST[i]));st.appendChild(c);}
  document.getElementById('dskill').textContent=d.t||'';
  var qt=document.getElementById('dquote'),ql=document.getElementById('dql');qt.textContent=d.q?(LANG==='en'?'“'+d.q+'”':'「'+d.q+'」'):'';qt.hidden=ql.hidden=!d.q;
  var op=document.getElementById('downpage');if(op)op.href='gods/'+g.s+'.html';}
 function render(){
  [].forEach.call(tabs.children,function(b){b.setAttribute('aria-selected',b.dataset.k===tab?'true':'false');});
  [].forEach.call(roles.children,function(b){b.setAttribute('aria-pressed',b.dataset.r===role?'true':'false');});
  var s=(q.value||'').trim().toLowerCase();list.innerHTML='';var n=0,first=null,still=false;
  G.forEach(function(g){var d=L(g);if(tab!=='all'&&!g.f.some(function(f){return FK[f]===tab;}))return;if(role&&d.r.indexOf(role)<0)return;
   if(s&&[g.zh.n,g.tw.n,g.ja.n,g.en.n].join('|').toLowerCase().indexOf(s)<0)return;n++;if(!first)first=g.s;if(g.s===pick)still=true;
   var b=document.createElement('button');b.type='button';b.className='godbtn';b.setAttribute('aria-pressed',g.s===pick?'true':'false');
   var im=el('img');im.src=P+'img/gods/'+g.s+'.webp';im.alt='';im.loading='lazy';b.appendChild(im);
   var sp=el('span');sp.appendChild(el('b',null,d.n));sp.appendChild(el('i',null,facName(g)));b.appendChild(sp);
   b.onclick=function(){pick=g.s;history.replaceState(null,'','#'+g.s);render();if(window.innerWidth<900)document.querySelector('.detail').scrollIntoView({behavior:'smooth'});};list.appendChild(b);});
  if(!n)list.appendChild(el('p',null,'該当する神格がいません。'));
  if(!still&&first){pick=first;if(list.firstChild&&list.firstChild.setAttribute)list.firstChild.setAttribute('aria-pressed','true');}
  document.getElementById('shown').textContent=n;detail();}
 q.addEventListener('input',render);render();
